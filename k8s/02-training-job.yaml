# One-off training run. Applied directly:
#   kubectl apply -f k8s/02-training-job.yaml
# Uses the locally built image (mlops-pipeline-train:latest), which Docker
# Desktop's built-in Kubernetes shares directly from the local Docker cache —
# no registry push needed. If you're on a different cluster (minikube, a
# cloud cluster), replace `image` below with a pushed registry image instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: mlops
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: mlops-pipeline-train:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-server:5000"
            - name: DATASET_NAME
              value: "wine"   # change to "iris" to train/register the second model
            - name: AUGMENT_FACTOR
              value: "2"
            - name: NOISE_STD
              value: "0.03"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
