# Scheduled retraining, e.g. weekly, so the model keeps up with data drift.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-retrain
  namespace: mlops
spec:
  schedule: "0 3 * * 0"  # 03:00 every Sunday
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: train
              image: mlops-pipeline-train:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow-server:5000"
                - name: DATASET_NAME
                  value: "wine"
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
